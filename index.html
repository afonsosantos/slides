<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afonso Santos | Presentations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --fg: #e6e8eb;
      --fg-dim: #8b93a1;
      --rule: rgba(230, 232, 235, 0.16);
      --accent: #e8b339;
      --card-bg: rgba(230, 232, 235, 0.03);
      --card-border-hover: rgba(232, 179, 57, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      max-width: 640px;
      margin: 5rem auto;
      padding: 0 1.5rem;
      color: var(--fg);
      background: var(--bg);
    }
    .meta {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    h1 {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      margin: 0.5rem 0 0;
    }
    h1::before {
      content: '// ';
      color: var(--accent);
      font-weight: 400;
    }
    .lead {
      color: var(--fg-dim);
      margin: 0.6rem 0 3rem;
    }
    .rule {
      width: 44px;
      height: 2px;
      background: var(--accent);
      margin: 0 0 1.25rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li + li {
      margin-top: 0.9rem;
    }
    a {
      display: block;
      padding: 1.25rem 1.4rem;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--rule);
      color: var(--fg);
      text-decoration: none;
      transition: border-color 0.15s ease;
    }
    a:hover {
      border-color: var(--card-border-hover);
    }
    .title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.15rem;
    }
    .desc {
      display: block;
      font-size: 0.85rem;
      color: var(--fg-dim);
      margin-top: 0.35rem;
    }
    footer {
      margin-top: 3rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--fg-dim);
      opacity: 0.75;
    }
    footer a {
      display: inline;
      padding: 0;
      border: none;
      background: none;
      color: var(--fg-dim);
      border-bottom: 1px solid var(--rule);
    }
    footer a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>
  <p class="meta">Afonso Santos</p>
  <h1>Presentations</h1>
  <p class="lead">Talks and decks, mostly about open source.</p>

  <p class="meta accent" style="color: var(--accent)">Conferences</p>
  <div class="rule"></div>
  <ul>
    <li>
      <a href="./pycon-pt-2026/">
        <span class="title">Ticketing has a default. It's the wrong one.</span>
        <span class="desc">PyCon Portugal 2026 · Aveiro</span>
      </a>
    </li>
    <li>
      <a href="https://docs.google.com/presentation/d/e/2PACX-1vSlJb9YRdCPixgPeP6BLotcCn3l3ZbF8GveMw-J5inbu7hkulSv8u7RehM6wEo6CoZSbUMTBAv_lyRD/pub?slide=id.p">
        <span class="title">AI CMS</span>
        <span class="desc">PyCon Portugal 2025 · Cascais</span>
      </a>
    </li>
  </ul>

  <footer>Built with <a href="https://sli.dev">Slidev</a></footer>
</body>
</html>
