<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afonso Santos | Presentations</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --card-bg: #fff;
      --card-border: #e0e0e0;
      --card-border-hover: #999;
      --desc: #666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eaeaea;
        --card-bg: #1c1c1c;
        --card-border: #333;
        --card-border-hover: #666;
        --desc: #999;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: var(--fg);
      background: var(--bg);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 0.75rem;
    }
    a {
      display: block;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--fg);
      text-decoration: none;
      transition: border-color 0.15s ease;
    }
    a:hover {
      border-color: var(--card-border-hover);
    }
    .title {
      font-weight: 600;
    }
    .desc {
      display: block;
      font-size: 0.85rem;
      color: var(--desc);
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h1>Presentations</h1>
  <ul>
    <li>
      <a href="./pycon-pt-2026/">
        <span class="title">Ticketing has a default. It's the wrong one.</span>
        <span class="desc">Lightning Talk · PyCon Portugal 2026</span>
      </a>
    </li>
  </ul>
</body>
</html>
