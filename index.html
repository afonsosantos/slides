<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentations</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 0.75rem;
    }
    a {
      display: block;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e0e0e0;
      color: #1a1a1a;
      text-decoration: none;
      transition: border-color 0.15s ease;
    }
    a:hover {
      border-color: #999;
    }
    .title {
      font-weight: 600;
    }
    .desc {
      display: block;
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <h1>Presentations</h1>
  <ul>
    <li>
      <a href="./pycon-pt-2026/">
        <span class="title">Ticketing has a default. It's the wrong one.</span>
        <span class="desc">Lightning Talk · PyCon Portugal 2026</span>
      </a>
    </li>
  </ul>
</body>
</html>
