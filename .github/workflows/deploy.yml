name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Build each presentation
        run: |
          set -e
          mkdir -p site
          cp index.html site/

          for dir in */; do
            dir="${dir%/}"
            [ -f "$dir/slides.md" ] || continue

            echo "Building $dir"
            (cd "$dir" && bun install && bun run build -- \
              --base "/slides/$dir/" \
              --router-mode hash)

            mkdir -p "site/$dir"
            cp -r "$dir/dist/." "site/$dir/"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
